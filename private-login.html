<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Private Preview · My Designer</title>
  <link rel="icon" type="image/png" href="/assets/pin-n-pitch-navicon.png" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 16% 12%,#33180f 0,transparent 38%),radial-gradient(ellipse at 90% 86%,#21120d 0,transparent 34%),#070605;color:#f7f3ef;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:38px;border:1px solid rgba(255,255,255,.14);border-radius:26px;background:rgba(25,22,20,.68);box-shadow:0 28px 90px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:36px}.brand img{width:116px;height:auto}.brand span{height:27px;width:1px;background:rgba(255,255,255,.18)}.brand b{font-size:13px;letter-spacing:.01em}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#f5804b;font-weight:750;margin:0 0 8px}h1{font-size:29px;line-height:1.12;letter-spacing:-.7px;margin:0 0 9px}p{font-size:13px;color:#aaa19a;margin:0 0 25px}.field-label{font-size:11px;color:#d6cec8;display:block;margin:0 0 7px}.field{width:100%;height:48px;border:1px solid rgba(255,255,255,.15);border-radius:13px;background:rgba(255,255,255,.055);padding:0 14px;color:#fff;font:inherit;outline:none}.field:focus{border-color:#f5753c;box-shadow:0 0 0 3px rgba(244,81,11,.15)}.field::placeholder{color:#80766f}.submit{width:100%;height:48px;border:1px solid rgba(255,137,67,.5);border-radius:999px;background:linear-gradient(135deg,#fa641a,#d83b05);color:#fff;font:650 13px inherit;margin-top:15px;cursor:pointer;box-shadow:0 7px 24px rgba(234,72,7,.2)}.submit:hover{filter:brightness(1.08)}.submit:disabled{opacity:.65;cursor:wait}.error{min-height:20px;color:#ff9c78;font-size:11px;margin-top:10px}.foot{border-top:1px solid rgba(255,255,255,.1);margin-top:25px;padding-top:15px;color:#827970;font-size:10px;display:flex;justify-content:space-between;gap:10px}.foot a{color:#f18a58;text-decoration:none}.foot a:hover{text-decoration:underline}@media(max-width:480px){.card{padding:28px 22px;border-radius:21px}.brand{margin-bottom:28px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/assets/pin-n-pitch-logo.png" alt="Pin ’n Pitch"/><span></span><b>My Designer</b></div>
    <div class="eyebrow">Private investor preview</div>
    <h1>Welcome to the concept.</h1>
    <p>This preview is shared by invitation. Enter the access code you received to continue.</p>
    <form id="unlockForm">
      <label class="field-label" for="accessCode">Access code</label>
      <input class="field" id="accessCode" name="password" type="password" placeholder="Enter your access code" autocomplete="current-password" required autofocus />
      <button class="submit" type="submit" id="submitButton">Open private preview&nbsp; ↗</button>
      <div class="error" id="error" aria-live="polite"></div>
    </form>
    <div class="foot"><span>Powered by Pin n Pitch</span><a href="https://www.pinandpitch.com" target="_blank" rel="noreferrer">pinandpitch.com ↗</a></div>
  </main>
  <script>
    const form=document.getElementById('unlockForm'),input=document.getElementById('accessCode'),button=document.getElementById('submitButton'),error=document.getElementById('error');
    form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;button.textContent='Checking access…';error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:input.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not unlock preview.');location.replace('./')}catch(err){error.textContent=err.message;button.disabled=false;button.innerHTML='Open private preview&nbsp; ↗';input.select()}});
  </script>
</body>
</html>
